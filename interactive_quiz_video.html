<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Video - Máy Biến Áp & Truyền Tải Điện Năng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: #0a0a1a;
    color: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ============ VIDEO PLAYER CONTAINER ============ */
  #video-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0a0a2e 0%, #1a0a3e 50%, #0a1a3e 100%);
    overflow: hidden;
  }

  /* Animated background particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: float linear infinite;
    opacity: 0.15;
  }

  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.15; }
    100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
  }

  /* ============ PROGRESS BAR (top) ============ */
  #progress-bar-container {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: rgba(255,255,255,0.1);
    z-index: 100;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff6bcb);
    transition: width 0.5s ease;
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 15px rgba(123,47,247,0.5);
  }

  /* ============ SLIDE CONTAINER ============ */
  .slide {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: all;
  }

  /* ============ INTRO SLIDE ============ */
  .intro-title {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 900;
    text-align: center;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff6bcb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
    animation: glowPulse 2s ease-in-out infinite;
  }
  .intro-subtitle {
    font-size: clamp(14px, 2vw, 22px);
    color: rgba(255,255,255,0.6);
    text-align: center;
    margin-bottom: 40px;
    font-weight: 300;
  }
  .intro-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(123,47,247,0.2);
    border: 1px solid rgba(123,47,247,0.4);
    border-radius: 30px;
    padding: 8px 20px;
    font-size: 14px;
    color: #c4a8ff;
    margin-bottom: 24px;
  }

  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(123,47,247,0.3)); }
    50% { filter: drop-shadow(0 0 40px rgba(123,47,247,0.6)); }
  }

  .start-btn {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    border: none;
    color: #fff;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    box-shadow: 0 4px 30px rgba(123,47,247,0.4);
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(123,47,247,0.6);
  }

  /* ============ SECTION INTRO SLIDE ============ */
  .section-number {
    font-size: clamp(60px, 10vw, 120px);
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: clamp(20px, 3.5vw, 36px);
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }
  .section-desc {
    font-size: clamp(13px, 1.8vw, 18px);
    color: rgba(255,255,255,0.5);
    text-align: center;
    max-width: 500px;
  }

  /* ============ QUESTION SLIDE ============ */
  .question-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
    max-width: 800px;
  }
  .question-number-badge {
    min-width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 4px 20px rgba(123,47,247,0.4);
  }
  .question-meta {
    flex: 1;
  }
  .question-label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .question-timer {
    font-size: 14px;
    color: #00d4ff;
    font-weight: 500;
  }

  .question-text {
    font-size: clamp(16px, 2.5vw, 24px);
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 32px;
    width: 100%;
    max-width: 800px;
    text-align: left;
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 800px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px 20px;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    color: #fff;
    font-size: clamp(14px, 1.6vw, 17px);
    font-weight: 400;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    text-align: left;
    line-height: 1.5;
  }
  .option-btn:hover:not(.disabled) {
    background: rgba(123,47,247,0.15);
    border-color: rgba(123,47,247,0.5);
    transform: translateX(8px);
  }
  .option-btn .opt-letter {
    min-width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.3s ease;
  }
  .option-btn.correct {
    background: rgba(16,185,129,0.15);
    border-color: #10B981;
    animation: correctPop 0.5s ease;
  }
  .option-btn.correct .opt-letter {
    background: #10B981;
  }
  .option-btn.wrong {
    background: rgba(239,68,68,0.15);
    border-color: #EF4444;
    animation: wrongShake 0.5s ease;
  }
  .option-btn.wrong .opt-letter {
    background: #EF4444;
  }
  .option-btn.disabled {
    cursor: default;
    opacity: 0.6;
  }
  .option-btn.correct.disabled {
    opacity: 1;
  }

  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ============ EXPLANATION BOX ============ */
  .explanation-box {
    width: 100%;
    max-width: 800px;
    margin-top: 20px;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    font-size: 15px;
    line-height: 1.6;
    color: rgba(255,255,255,0.8);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .explanation-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .explanation-box .exp-label {
    font-weight: 700;
    color: #00d4ff;
    margin-bottom: 6px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ============ RESULT SLIDE ============ */
  .result-score {
    font-size: clamp(60px, 12vw, 140px);
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff6bcb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-label {
    font-size: 20px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
  }
  .result-stats {
    display: flex;
    gap: 32px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 800;
  }
  .stat-value.green { color: #10B981; }
  .stat-value.red { color: #EF4444; }
  .stat-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
  }

  .restart-btn {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    border: none;
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    box-shadow: 0 4px 30px rgba(123,47,247,0.4);
  }
  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(123,47,247,0.6);
  }

  /* ============ NAV CONTROLS (bottom) ============ */
  #nav-controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
  }
  .nav-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .nav-btn:hover:not(:disabled) {
    background: rgba(123,47,247,0.3);
    border-color: rgba(123,47,247,0.6);
  }
  .nav-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .slide-counter {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    min-width: 60px;
    text-align: center;
  }

  /* ============ COUNTDOWN TIMER CIRCLE ============ */
  .timer-ring {
    position: absolute;
    top: 24px;
    right: 24px;
    z-index: 100;
  }
  .timer-ring svg {
    transform: rotate(-90deg);
  }
  .timer-ring .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.08);
    stroke-width: 4;
  }
  .timer-ring .ring-progress {
    fill: none;
    stroke: #00d4ff;
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .timer-ring .timer-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    font-weight: 700;
    color: #00d4ff;
  }
  .timer-ring .timer-text.warning { color: #F59E0B; }
  .timer-ring .timer-text.danger { color: #EF4444; }

  /* ============ CONFETTI ============ */
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ============ SOUND TOGGLE ============ */
  #sound-toggle {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .slide { padding: 24px 16px; }
    .option-btn { padding: 12px 14px; gap: 10px; }
    .option-btn .opt-letter { min-width: 30px; height: 30px; font-size: 13px; }
    .question-number-badge { min-width: 44px; height: 44px; font-size: 18px; }
    #nav-controls { bottom: 16px; }
  }
</style>
</head>
<body>

<div id="video-container">
  <!-- Background particles -->
  <div id="particles"></div>

  <!-- Progress bar -->
  <div id="progress-bar-container">
    <div id="progress-bar" style="width: 0%"></div>
  </div>

  <!-- Timer ring -->
  <div class="timer-ring" id="timer-ring" style="display: none;">
    <svg width="60" height="60">
      <circle class="ring-bg" cx="30" cy="30" r="26"/>
      <circle class="ring-progress" id="ring-progress" cx="30" cy="30" r="26" 
        stroke-dasharray="163.36" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text" id="timer-text">30</div>
  </div>

  <!-- All slides will be dynamically injected here -->
  <div id="slides-container"></div>

  <!-- Navigation -->
  <div id="nav-controls">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()" disabled>◀</button>
    <span class="slide-counter" id="slide-counter">1 / 1</span>
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">▶</button>
  </div>
</div>

<script>
// ============ DATA ============
const quizData = {
  sections: [
    {
      title: "MÁY BIẾN ÁP",
      desc: "6 câu hỏi trắc nghiệm về cấu tạo và nguyên tắc hoạt động",
      questions: [
        {
          q: "Máy biến áp là thiết bị có chức năng chính là gì?",
          options: [
            "Biến đổi dòng điện xoay chiều thành dòng điện một chiều.",
            "Biến đổi điện áp xoay chiều mà không làm thay đổi tần số.",
            "Biến đổi cả điện áp và tần số của dòng điện xoay chiều.",
            "Làm tăng công suất của dòng điện xoay chiều."
          ],
          correct: 1,
          explanation: "Máy biến áp chỉ biến đổi điện áp xoay chiều, không thay đổi tần số. Đây là nguyên lý cốt lõi của máy biến áp."
        },
        {
          q: "Cấu tạo chính của máy biến áp gồm những bộ phận nào?",
          options: [
            "Một cuộn dây quấn trên một nam châm chữ U.",
            "Hai cuộn dây có số vòng khác nhau quấn trên một lõi biến áp.",
            "Hai cuộn dây có số vòng bằng nhau quấn trên một lõi sắt đặc.",
            "Một cuộn sơ cấp và một lớp vỏ máy chống sét."
          ],
          correct: 1,
          explanation: "Máy biến áp gồm 2 cuộn dây (sơ cấp N₁ và thứ cấp N₂) có số vòng khác nhau, quấn trên lõi biến áp bằng thép pha silic."
        },
        {
          q: "Lõi của máy biến áp thường được cấu tạo như thế nào?",
          options: [
            "Đúc từ một khối sắt hoặc thép nguyên khối.",
            "Làm bằng đồng nguyên chất để dẫn điện tốt.",
            "Làm bằng các lá sắt hoặc thép pha silic, ghép cách điện với nhau.",
            "Làm bằng các lá nhôm ghép sát vào nhau không qua cách điện."
          ],
          correct: 2,
          explanation: "Lõi gồm các lá thép pha silic ghép cách điện → giảm dòng Foucault → giảm tỏa nhiệt và hao phí."
        },
        {
          q: "Trong máy biến áp, cuộn dây được nối trực tiếp với nguồn điện xoay chiều (đầu vào) có tên gọi là gì?",
          options: [
            "Cuộn thứ cấp.",
            "Cuộn sơ cấp.",
            "Cuộn cảm ứng.",
            "Cuộn tải."
          ],
          correct: 1,
          explanation: "Cuộn sơ cấp (N₁, U₁) là cuộn nối trực tiếp với nguồn điện xoay chiều đầu vào."
        },
        {
          q: "Nguyên tắc hoạt động của máy biến áp dựa trên hiện tượng vật lý nào?",
          options: [
            "Hiện tượng tự cảm.",
            "Hiện tượng cộng hưởng điện.",
            "Tác dụng nhiệt của dòng điện.",
            "Hiện tượng cảm ứng điện từ."
          ],
          correct: 3,
          explanation: "Máy biến áp hoạt động dựa trên hiện tượng cảm ứng điện từ: từ thông biến thiên tạo suất điện động cảm ứng ở cuộn thứ cấp."
        },
        {
          q: "Để thiết bị hoạt động như một máy tăng áp thì mối liên hệ giữa số vòng dây cuộn sơ cấp (N₁) và cuộn thứ cấp (N₂) phải thỏa mãn điều kiện gì?",
          options: [
            "N₁ > N₂",
            "N₁ < N₂",
            "N₁ = N₂",
            "N₁ = 2N₂"
          ],
          correct: 1,
          explanation: "Máy tăng áp: U₂ > U₁ → N₂ > N₁ (hay N₁ < N₂). Tỉ số U₂/U₁ = N₂/N₁."
        }
      ]
    },
    {
      title: "TRUYỀN TẢI ĐIỆN NĂNG",
      desc: "4 câu hỏi trắc nghiệm về công suất truyền tải và giảm hao phí",
      questions: [
        {
          q: "Biện pháp hiệu quả nhất và được áp dụng phổ biến nhất để giảm công suất tỏa nhiệt (hao phí) trên đường dây truyền tải điện năng đi xa là gì?",
          options: [
            "Giảm điện trở của đường dây bằng cách rút ngắn khoảng cách.",
            "Tăng tiết diện dây dẫn (dùng dây to hơn).",
            "Tăng điện áp ở nơi phát điện trước khi truyền đi.",
            "Thay thế dây nhôm bằng dây đồng hoặc bạc."
          ],
          correct: 2,
          explanation: "Tăng điện áp U là phương án tối ưu nhất. Vì ΔP = P²R/(U²cos²φ), U nằm ở mẫu số với bậc 2."
        },
        {
          q: "Khi truyền tải một công suất điện P không đổi đi xa, nếu sử dụng máy biến áp để tăng điện áp truyền tải lên 10 lần thì công suất hao phí trên đường dây sẽ thay đổi như thế nào?",
          options: [
            "Giảm 10 lần.",
            "Giảm 100 lần.",
            "Tăng 10 lần.",
            "Không thay đổi."
          ],
          correct: 1,
          explanation: "Hao phí tỉ lệ nghịch với bình phương điện áp (U²). Điện áp tăng 10 lần → hao phí giảm 10² = 100 lần."
        },
        {
          q: "Trong sơ đồ truyền tải điện năng từ nhà máy đến khu dân cư, các máy biến áp được bố trí như thế nào?",
          options: [
            "Chỉ dùng máy tăng áp ở nhà máy phát điện.",
            "Chỉ dùng máy hạ áp ở khu dân cư.",
            "Dùng máy tăng áp ở nhà máy phát điện và dùng máy hạ áp ở khu dân cư.",
            "Dùng máy hạ áp ở nhà máy phát điện và dùng máy tăng áp ở khu dân cư."
          ],
          correct: 2,
          explanation: "Tăng áp để giảm hao phí khi truyền đi xa, hạ áp để đảm bảo an toàn khi đến nơi tiêu thụ."
        },
        {
          q: "Vì sao phương án tăng tiết diện dây dẫn (làm dây to ra) để giảm điện trở R, từ đó giảm hao phí lại ít được sử dụng trong thực tế?",
          options: [
            "Vì làm tăng hệ số công suất của toàn mạch điện.",
            "Vì tốn rất nhiều kim loại màu, dây quá nặng đòi hỏi hệ thống cột điện phải cực kỳ kiên cố, tốn kém chi phí khổng lồ.",
            "Vì làm tăng công suất P tại nơi phát điện.",
            "Vì điện trở tỉ lệ thuận với tiết diện dây nên dùng dây to sẽ làm điện trở tăng."
          ],
          correct: 1,
          explanation: "Đây là lý do tính kinh tế và kỹ thuật khiến việc tăng tiết diện dây không khả thi trong thực tế."
        }
      ]
    }
  ]
};

// ============ STATE ============
let slides = [];
let currentSlide = 0;
let score = 0;
let totalQuestions = 0;
let correctCount = 0;
let wrongCount = 0;
let timerInterval = null;
let timeLeft = 30;
const QUESTION_TIME = 30; // seconds per question
let answeredSlides = new Set();

// ============ BUILD SLIDES ============
function buildSlides() {
  const container = document.getElementById('slides-container');
  container.innerHTML = '';
  slides = [];

  // Slide 0: INTRO
  const introHtml = `
    <div class="slide" id="slide-0">
      <div class="intro-badge">
        <span>⚡</span> Interactive Quiz Video
      </div>
      <div class="intro-title">Máy Biến Áp &<br>Truyền Tải Điện Năng</div>
      <div class="intro-subtitle">Bài 3 – Vật Lí 12 · Phần 1 · 10 câu hỏi trắc nghiệm</div>
      <button class="start-btn" onclick="nextSlide()">▶&nbsp; BẮT ĐẦU NGAY</button>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', introHtml);
  slides.push({ type: 'intro' });

  let qIndex = 0;
  quizData.sections.forEach((section, si) => {
    // Section intro slide
    const secHtml = `
      <div class="slide" id="slide-${slides.length}">
        <div class="section-number">0${si + 1}</div>
        <div class="section-title">${section.title}</div>
        <div class="section-desc">${section.desc}</div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', secHtml);
    slides.push({ type: 'section' });

    // Question slides
    section.questions.forEach((question, qi) => {
      qIndex++;
      totalQuestions++;
      const letters = ['A', 'B', 'C', 'D'];
      const optionsHtml = question.options.map((opt, oi) => `
        <button class="option-btn" data-slide="${slides.length}" data-option="${oi}" onclick="selectAnswer(${slides.length}, ${oi}, ${question.correct})">
          <span class="opt-letter">${letters[oi]}</span>
          <span>${opt}</span>
        </button>
      `).join('');

      const qHtml = `
        <div class="slide" id="slide-${slides.length}">
          <div class="question-header">
            <div class="question-number-badge">${qIndex}</div>
            <div class="question-meta">
              <div class="question-label">Câu hỏi ${qIndex} / ${getTotalQ()}</div>
              <div class="question-timer" id="timer-label-${slides.length}">⏱ ${QUESTION_TIME}s</div>
            </div>
          </div>
          <div class="question-text">${question.q}</div>
          <div class="options-grid" id="options-${slides.length}">
            ${optionsHtml}
          </div>
          <div class="explanation-box" id="explanation-${slides.length}">
            <div class="exp-label">💡 Giải thích</div>
            <div>${question.explanation}</div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', qHtml);
      slides.push({ type: 'question', questionData: question, answered: false });
    });
  });

  // Result slide
  const resultHtml = `
    <div class="slide" id="slide-${slides.length}">
      <div class="result-score" id="result-score">0/0</div>
      <div class="result-label">Kết quả của bạn</div>
      <div class="result-stats">
        <div class="stat-item">
          <div class="stat-value green" id="stat-correct">0</div>
          <div class="stat-desc">Đúng ✓</div>
        </div>
        <div class="stat-item">
          <div class="stat-value red" id="stat-wrong">0</div>
          <div class="stat-desc">Sai ✗</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-percent" style="color: #00d4ff;">0%</div>
          <div class="stat-desc">Tỉ lệ</div>
        </div>
      </div>
      <button class="restart-btn" onclick="restart()">🔄 LÀM LẠI</button>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', resultHtml);
  slides.push({ type: 'result' });
}

function getTotalQ() {
  let c = 0;
  quizData.sections.forEach(s => c += s.questions.length);
  return c;
}

// ============ NAVIGATION ============
function goToSlide(index) {
  if (index < 0 || index >= slides.length) return;
  
  // Remove active from current
  const prev = document.getElementById(`slide-${currentSlide}`);
  if (prev) prev.classList.remove('active');

  currentSlide = index;
  const next = document.getElementById(`slide-${currentSlide}`);
  if (next) next.classList.add('active');

  // Update progress bar
  const pct = ((currentSlide) / (slides.length - 1)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';

  // Update counter
  document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;

  // Update nav buttons
  document.getElementById('btn-prev').disabled = currentSlide === 0;
  document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;

  // Timer logic
  clearInterval(timerInterval);
  const timerRing = document.getElementById('timer-ring');
  
  if (slides[currentSlide].type === 'question' && !slides[currentSlide].answered) {
    timerRing.style.display = 'block';
    startTimer(currentSlide);
  } else {
    timerRing.style.display = 'none';
  }

  // If result slide, update scores
  if (slides[currentSlide].type === 'result') {
    showResults();
  }

  // Auto-advance for section slides
  if (slides[currentSlide].type === 'section') {
    timerRing.style.display = 'none';
    setTimeout(() => {
      if (currentSlide === index && slides[currentSlide].type === 'section') {
        nextSlide();
      }
    }, 2500);
  }
}

function nextSlide() {
  goToSlide(currentSlide + 1);
}

function prevSlide() {
  goToSlide(currentSlide - 1);
}

// ============ TIMER ============
function startTimer(slideIndex) {
  timeLeft = QUESTION_TIME;
  const circumference = 2 * Math.PI * 26; // ~163.36
  updateTimerDisplay(slideIndex);
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay(slideIndex);
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      // Auto-mark as wrong (time out)
      if (!slides[slideIndex].answered) {
        timeoutAnswer(slideIndex);
      }
    }
  }, 1000);
}

function updateTimerDisplay(slideIndex) {
  const circumference = 163.36;
  const offset = circumference * (1 - timeLeft / QUESTION_TIME);
  document.getElementById('ring-progress').style.strokeDashoffset = offset;
  
  const timerText = document.getElementById('timer-text');
  timerText.textContent = timeLeft;
  timerText.className = 'timer-text';
  if (timeLeft <= 5) timerText.classList.add('danger');
  else if (timeLeft <= 10) timerText.classList.add('warning');
  
  const label = document.getElementById(`timer-label-${slideIndex}`);
  if (label) label.textContent = `⏱ ${timeLeft}s`;
}

function timeoutAnswer(slideIndex) {
  slides[slideIndex].answered = true;
  answeredSlides.add(slideIndex);
  wrongCount++;

  const optionBtns = document.querySelectorAll(`[data-slide="${slideIndex}"]`);
  const correctIdx = slides[slideIndex].questionData.correct;
  
  optionBtns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (parseInt(btn.dataset.option) === correctIdx) {
      btn.classList.add('correct');
    }
  });

  // Show explanation
  const expBox = document.getElementById(`explanation-${slideIndex}`);
  if (expBox) {
    setTimeout(() => expBox.classList.add('show'), 300);
  }

  document.getElementById('timer-ring').style.display = 'none';

  // Auto advance after delay
  setTimeout(() => {
    if (currentSlide === slideIndex) nextSlide();
  }, 3000);
}

// ============ ANSWER SELECTION ============
function selectAnswer(slideIndex, optionIndex, correctIndex) {
  if (slides[slideIndex].answered) return;
  
  slides[slideIndex].answered = true;
  answeredSlides.add(slideIndex);
  clearInterval(timerInterval);
  document.getElementById('timer-ring').style.display = 'none';

  const optionBtns = document.querySelectorAll(`[data-slide="${slideIndex}"]`);
  const isCorrect = optionIndex === correctIndex;

  if (isCorrect) {
    correctCount++;
    score++;
  } else {
    wrongCount++;
  }

  optionBtns.forEach((btn) => {
    const oi = parseInt(btn.dataset.option);
    btn.classList.add('disabled');
    if (oi === correctIndex) {
      btn.classList.add('correct');
    } else if (oi === optionIndex && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  // Show explanation
  const expBox = document.getElementById(`explanation-${slideIndex}`);
  if (expBox) {
    setTimeout(() => expBox.classList.add('show'), 400);
  }

  // Play sound effect via Web Audio
  playSound(isCorrect);

  // Auto advance
  setTimeout(() => {
    if (currentSlide === slideIndex) nextSlide();
  }, 3500);
}

// ============ RESULTS ============
function showResults() {
  document.getElementById('result-score').textContent = `${correctCount}/${getTotalQ()}`;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  const pct = Math.round((correctCount / getTotalQ()) * 100);
  document.getElementById('stat-percent').textContent = pct + '%';

  // Confetti if score > 60%
  if (pct >= 60) {
    launchConfetti();
  }
}

// ============ RESTART ============
function restart() {
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  answeredSlides.clear();
  clearInterval(timerInterval);
  buildSlides();
  currentSlide = 0;
  goToSlide(0);
}

// ============ PARTICLES ============
function createParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const colors = ['#7b2ff7', '#00d4ff', '#ff6bcb', '#10B981', '#F59E0B'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ============ CONFETTI ============
function launchConfetti() {
  const container = document.getElementById('video-container');
  const colors = ['#7b2ff7', '#00d4ff', '#ff6bcb', '#10B981', '#F59E0B', '#EF4444', '#3B82F6'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (Math.random() * 8 + 4) + 'px';
    piece.style.height = (Math.random() * 8 + 4) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.8) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

// ============ SOUND (Web Audio API) ============
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(isCorrect) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.value = 0.15;
    
    if (isCorrect) {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
    } else {
      osc.frequency.setValueAtTime(311.13, ctx.currentTime); // Eb4
      osc.frequency.setValueAtTime(261.63, ctx.currentTime + 0.15); // C4
    }
    
    osc.type = 'sine';
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

// ============ KEYBOARD SHORTCUTS ============
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  if (slides[currentSlide]?.type === 'question' && !slides[currentSlide].answered) {
    const keyMap = { 'a': 0, 'b': 1, 'c': 2, 'd': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    const idx = keyMap[e.key.toLowerCase()];
    if (idx !== undefined) {
      const btn = document.querySelector(`[data-slide="${currentSlide}"][data-option="${idx}"]`);
      if (btn) btn.click();
    }
  }
});

// ============ INIT ============
createParticles();
buildSlides();
goToSlide(0);
</script>
