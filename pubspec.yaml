name: vietschool
description: VietSchool mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  http: ^1.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "logo.jpg"
